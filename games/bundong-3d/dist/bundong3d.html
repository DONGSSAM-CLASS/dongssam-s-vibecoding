<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>번동중 퇴마록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f4efe4;
  --ink-dim: #c9c2b2;
  --panel: rgba(18, 22, 30, 0.86);
  --panel-line: rgba(232, 196, 120, 0.45);
  --gold: #e8c478;
  --red: #d8463a;
  --jade: #4fbf8a;
  --blue: #5d8fd8;
  --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --serif: "Noto Serif KR", "Batang", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: var(--ink); font-family: var(--font); }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font-family: inherit; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; }
.screen.dim { background: rgba(6, 8, 12, 0.55); backdrop-filter: blur(3px); }

.btn {
  display: inline-block; padding: 12px 26px; margin: 6px; border-radius: 8px; cursor: pointer;
  font-size: 17px; font-weight: 700; color: var(--ink); background: rgba(30, 36, 48, 0.85);
  border: 1px solid var(--panel-line); transition: transform .1s, background .15s;
}
.btn:hover { background: rgba(60, 70, 90, 0.95); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(180deg, #b7372d, #8c241c); border-color: #f0b2a0; }
.btn.primary:hover { background: linear-gradient(180deg, #cf4639, #a02d24); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.small { padding: 6px 12px; font-size: 13px; }

/* 로딩 */
#loading { background: #0b0d12; z-index: 40; }
.load-box { width: min(420px, 86vw); text-align: center; }
.load-title { font-family: var(--serif); font-size: 40px; font-weight: 900; margin-bottom: 18px; color: var(--gold); }
.load-bar { height: 8px; background: #222833; border-radius: 4px; overflow: hidden; }
#loadFill { height: 100%; width: 0; background: linear-gradient(90deg, #b7372d, #e8c478); transition: width .2s; }
#loadText { margin-top: 10px; color: var(--ink-dim); font-size: 14px; }

/* 타이틀 */
#title { background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(5,8,14,0.7) 100%); align-items: flex-end; }
.title-wrap { text-align: center; padding: 0 16px 8vh; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.title-sub { font-size: 18px; letter-spacing: .2em; color: #fff; opacity: .9; }
.title-main { font-family: var(--serif); font-size: clamp(48px, 9vw, 104px); margin: 6px 0 0; font-weight: 900; color: #fff;
  -webkit-text-stroke: 1px rgba(120, 20, 12, .6); }
.title-hanja { font-family: var(--serif); font-size: 20px; letter-spacing: .5em; color: var(--gold); margin-bottom: 22px; }
.title-foot { margin-top: 18px; font-size: 14px; color: #eee; opacity: .85; }

/* 캐릭터 선택 */
#select { background: rgba(8, 10, 16, 0.62); backdrop-filter: blur(4px); }
.sel-wrap { text-align: center; padding: 16px; max-width: 760px; width: 100%; }
.sel-wrap h2 { font-family: var(--serif); font-size: 30px; }
.sel-cards { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
.sel-card { width: 250px; padding: 14px; border-radius: 14px; background: var(--panel); border: 2px solid transparent; cursor: pointer; transition: border .15s, transform .15s; }
.sel-card:hover { transform: translateY(-3px); }
.sel-card.on { border-color: var(--gold); box-shadow: 0 0 24px rgba(232, 196, 120, .35); }
.sel-photo { width: 100%; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: #1c2230; }
.sel-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sel-name { font-size: 20px; font-weight: 900; margin: 10px 0 4px; }
.sel-row { margin-top: 16px; }
.sel-row input { font-family: inherit; font-size: 17px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-line); background: #141922; color: var(--ink); width: 200px; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.85); box-shadow: 0 0 2px #000; }
#crosshair::before { left: 10px; top: 3px; width: 2px; height: 16px; }
#crosshair::after { top: 10px; left: 3px; height: 2px; width: 16px; }
#crosshair.hit::before, #crosshair.hit::after { background: #ff6a50; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(120,0,0,0.0) 100%); transition: background .2s; }
#hitFlash { position: absolute; inset: 0; background: rgba(200, 20, 10, 0); }

#hudTL { position: absolute; left: 16px; top: 16px; display: flex; gap: 10px; align-items: flex-start; }
#hudPortrait { width: 62px; height: 62px; border-radius: 10px; object-fit: cover; border: 2px solid var(--gold); background: #222; }
.hud-bars { width: 230px; }
#hudName { font-weight: 900; font-size: 15px; text-shadow: 0 1px 3px #000; margin-bottom: 4px; }
.bar { position: relative; height: 14px; background: rgba(0,0,0,.55); border-radius: 7px; overflow: hidden; margin-bottom: 4px; border: 1px solid rgba(255,255,255,.15); }
.bar > div { height: 100%; width: 100%; transition: width .15s; }
.bar.hp > div { background: linear-gradient(90deg, #a1251c, #e2533f); }
.bar.st { height: 6px; } .bar.st > div { background: #e8d27a; }
.bar.sh > div { background: linear-gradient(90deg, #2c9c6a, #7ff0b8); }
.bar span { position: absolute; right: 8px; top: -1px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; }
#buffs { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; }
#buffs .buff { background: rgba(0,0,0,.55); padding: 1px 7px; border-radius: 10px; border: 1px solid var(--panel-line); }

#hudTop { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
#compass { position: relative; width: 420px; max-width: 60vw; height: 26px; overflow: hidden; background: rgba(0,0,0,.4); border-radius: 13px; border: 1px solid rgba(255,255,255,.15);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
#compassStrip { position: absolute; top: 0; left: 0; height: 100%; white-space: nowrap; }
#compassStrip span { position: absolute; top: 4px; font-size: 13px; font-weight: 700; transform: translateX(-50%); color: #ddd; }
#compassStrip span.cardinal { color: #fff; font-size: 14px; }
#compassStrip span.n { color: #ff7a5a; }
#compassMark { position: absolute; top: 2px; font-size: 16px; color: var(--gold); transform: translateX(-50%); text-shadow: 0 0 6px #000; }
#clockRow { margin-top: 4px; font-size: 14px; font-weight: 700; text-shadow: 0 1px 3px #000; display: flex; gap: 8px; justify-content: center; }

#minimap { position: absolute; right: 16px; top: 16px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(0,0,0,.5); }
#quest { position: absolute; right: 16px; top: 210px; width: 270px; font-size: 14px; text-shadow: 0 1px 3px #000; }
#quest .q { background: rgba(0,0,0,.42); border-left: 3px solid var(--gold); padding: 6px 10px; margin-bottom: 6px; border-radius: 0 6px 6px 0; }
#quest .q.done { opacity: .5; text-decoration: line-through; border-color: var(--jade); }
#quest .qt { font-weight: 900; color: var(--gold); font-size: 12px; }

#prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 8px 16px; border-radius: 8px; font-weight: 700; border: 1px solid var(--panel-line); }
#prompt b { background: var(--gold); color: #000; padding: 1px 7px; border-radius: 4px; margin-right: 6px; }
#toasts { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast { background: rgba(0,0,0,.6); padding: 7px 16px; border-radius: 18px; font-weight: 700; animation: toastIn .25s ease-out; border: 1px solid var(--panel-line); }
.toast.big { font-family: var(--serif); font-size: 26px; padding: 10px 26px; color: var(--gold); }
.toast.warn { color: #ffb3a5; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

#bossBar { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); width: min(560px, 80vw); text-align: center; }
.boss-name { font-family: var(--serif); font-weight: 900; font-size: 20px; color: #d9b6ff; text-shadow: 0 0 8px #000; }
.bar.boss { height: 16px; } .bar.boss > div { background: linear-gradient(90deg, #3a1060, #9b4ad8); }

#hotbar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.slot { position: relative; width: 62px; height: 62px; border-radius: 10px; background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.18); overflow: hidden; }
.slot.on { border-color: var(--gold); box-shadow: 0 0 14px rgba(232,196,120,.5); }
.slot.empty { opacity: .35; }
.slot .num { position: absolute; left: 4px; top: 2px; font-size: 11px; font-weight: 700; z-index: 2; }
.slot .ico { position: absolute; inset: 6px 6px 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.slot .ico img { width: 100%; height: 100%; object-fit: contain; }
.slot .nm { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; font-size: 10px; white-space: nowrap; }
.slot .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(10,10,20,.72); z-index: 1; }
#consumables { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; font-size: 13px; text-shadow: 0 1px 2px #000; }
.cons b { background: rgba(255,255,255,.85); color: #000; padding: 0 5px; border-radius: 3px; margin-right: 3px; }
#purified { position: absolute; left: 16px; bottom: 18px; font-weight: 900; font-size: 15px; text-shadow: 0 1px 3px #000; background: rgba(0,0,0,.4); padding: 6px 12px; border-radius: 8px; }
#purified span { color: var(--gold); font-size: 20px; }

/* 패널 */
.panel { position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 14px; width: min(920px, 94vw); max-height: 90vh; overflow: auto; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 900; }
.close { background: none; border: none; color: var(--ink); font-size: 20px; cursor: pointer; }
.tabs, .pause-tabs { display: flex; gap: 6px; }
.tab { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--ink); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; }
.tab.on { background: rgba(232,196,120,.18); border-color: var(--gold); }
#bagItems { display: grid; grid-template-columns: 1fr 280px; gap: 14px; }
#bagCap { grid-column: 1 / -1; font-size: 13px; color: var(--ink-dim); }
#bagGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; align-content: start; }
.bslot { aspect-ratio: 1; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; position: relative; }
.bslot:hover { border-color: var(--gold); }
.bslot small { font-size: 10px; margin-top: 2px; }
.bslot i { position: absolute; right: 5px; bottom: 2px; font-style: normal; font-size: 12px; font-weight: 700; }
#bagDetail { background: rgba(0,0,0,.25); border-radius: 8px; padding: 10px; font-size: 14px; line-height: 1.6; min-height: 120px; }
#craft { grid-column: 1 / -1; }
#craft h4 { margin: 4px 0 6px; }
.recipe { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.25); padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
.recipe .btn { margin-left: auto; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.cx { background: rgba(0,0,0,.28); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.1); font-size: 13px; line-height: 1.6; }
.cx.locked { opacity: .45; }
.cx h3 { margin: 0; font-family: var(--serif); color: var(--gold); }
.cx .meta { color: var(--ink-dim); font-size: 12px; }
.cx img { width: 100%; height: 130px; object-fit: contain; background: radial-gradient(circle, #2b3242, #12161e); border-radius: 8px; }
#bigmap { width: 100%; height: auto; border-radius: 8px; background: #111; }

/* 모달 */
#modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(5,6,10,.55); }
.modal-box { width: min(680px, 92vw); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 16px; padding: 20px 22px; text-align: center; }
.modal-box h2 { font-family: var(--serif); color: var(--gold); margin: 6px 0; font-size: 32px; }
.modal-box .hanja { font-family: var(--serif); letter-spacing: .3em; color: var(--ink-dim); }
.modal-box .relic-img { width: 260px; height: 200px; object-fit: contain; display: block; margin: 8px auto; background: radial-gradient(circle, #3a3324, #12161e 70%); border-radius: 12px; }
.modal-box .meta { font-size: 13px; color: var(--ink-dim); }
.modal-box .desc { text-align: left; line-height: 1.75; font-size: 15px; margin: 10px 0; }
.modal-box .skill { text-align: left; background: rgba(232,196,120,.1); border-left: 3px solid var(--gold); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.modal-box .board { text-align: left; white-space: pre-line; line-height: 1.8; font-size: 15px; background: #2a3b2e; border: 8px solid #6b4a2c; padding: 14px 18px; border-radius: 6px; font-family: var(--serif); }

/* 일시정지 */
.pause-box { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 18px 24px; width: min(560px, 92vw); max-height: 90vh; overflow: auto; }
.pause-box.center { text-align: center; }
.pause-box h2 { font-family: var(--serif); margin-top: 0; }
.ppane { margin-top: 12px; display: flex; flex-direction: column; }
.ppane label { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); gap: 10px; }
.ppane label.chk { justify-content: flex-start; }
.ppane select, .ppane input[type=range] { width: 200px; }
.ppane select { background: #141922; color: var(--ink); border: 1px solid var(--panel-line); padding: 4px; border-radius: 6px; font-family: inherit; }
.how table { width: 100%; border-collapse: collapse; font-size: 14px; }
.how td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
.how td:first-child { width: 42%; }
.how kbd { background: #e9e4d6; color: #111; padding: 1px 6px; border-radius: 4px; font-family: inherit; font-weight: 700; font-size: 12px; box-shadow: 0 2px 0 #9b9585; }
#clickToPlay { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 15; background: rgba(0,0,0,.6); padding: 12px 22px; border-radius: 10px; font-weight: 700; }

@media (max-width: 720px) {
  #quest { display: none; }
  #minimap { width: 110px; height: 110px; }
  .hud-bars { width: 150px; }
  #bagItems { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 로딩 -->
<div id="loading" class="screen">
  <div class="load-box">
    <div class="load-title">번동중 퇴마록</div>
    <div class="load-bar"><div id="loadFill"></div></div>
    <div id="loadText">학교를 짓는 중…</div>
  </div>
</div>

<!-- 타이틀 -->
<div id="title" class="screen hidden">
  <div class="title-wrap">
    <div class="title-sub">번동중학교에 악령이 침입했다</div>
    <h1 class="title-main">번동중 퇴마록</h1>
    <div class="title-hanja">樊洞中 退魔錄</div>
    <div class="title-btns">
      <button id="btnNew" class="btn primary">새로 시작</button>
      <button id="btnContinue" class="btn hidden">이어하기</button>
      <button id="btnHowTitle" class="btn">조작법</button>
    </div>
    <div class="title-foot">학교 곳곳에 숨겨진 우리 역사 유물을 찾아, 유물의 힘으로 악령을 정화하세요.</div>
  </div>
</div>

<!-- 캐릭터 선택 -->
<div id="select" class="screen hidden">
  <div class="sel-wrap">
    <h2>나는 번동중학교 학생입니다</h2>
    <div class="sel-cards">
      <div class="sel-card" data-gender="male">
        <div class="sel-photo"><img alt="남학생 사진" data-photo="male"></div>
        <div class="sel-name">남학생</div>
        <label class="btn small">사진 바꾸기<input type="file" accept="image/*" data-upload="male" hidden></label>
      </div>
      <div class="sel-card" data-gender="female">
        <div class="sel-photo"><img alt="여학생 사진" data-photo="female"></div>
        <div class="sel-name">여학생</div>
        <label class="btn small">사진 바꾸기<input type="file" accept="image/*" data-upload="female" hidden></label>
      </div>
    </div>
    <div class="sel-row">
      <label>이름 <input id="playerName" maxlength="10" placeholder="이름을 입력하세요" value=""></label>
    </div>
    <div class="sel-row">
      <button id="btnBackTitle" class="btn">뒤로</button>
      <button id="btnStart" class="btn primary" disabled>학교로 들어가기</button>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="vignette"></div>
  <div id="hitFlash"></div>
  <div id="hudTL">
    <img id="hudPortrait" alt="">
    <div class="hud-bars">
      <div id="hudName">학생</div>
      <div class="bar hp"><div id="hpFill"></div><span id="hpText">100</span></div>
      <div class="bar st"><div id="stFill"></div></div>
      <div class="bar sh hidden" id="shBar"><div id="shFill"></div></div>
      <div id="buffs"></div>
    </div>
  </div>
  <div id="hudTop">
    <div id="compass"><div id="compassStrip"></div><div id="compassMark"></div></div>
    <div id="clockRow"><span id="clock">08:20</span><span id="weatherIcon">☀</span><span id="weatherName">맑음</span></div>
  </div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="quest"></div>
  <div id="prompt" class="hidden"></div>
  <div id="toasts"></div>
  <div id="bossBar" class="hidden"><div class="boss-name">어둑시니</div><div class="bar boss"><div id="bossFill"></div></div></div>
  <div id="hotbar"></div>
  <div id="consumables">
    <div class="cons" id="consPat"><b>G</b> 팥 <span>0</span></div>
    <div class="cons" id="consSsuk"><b>H</b> 쑥 <span>0</span></div>
    <div class="cons" id="consJuk"><b>J</b> 팥죽 <span>0</span></div>
  </div>
  <div id="purified">정화 <span>0</span></div>
</div>

<!-- 가방 -->
<div id="bag" class="panel hidden">
  <div class="panel-head">
    <div class="tabs"><button class="tab on" data-tab="items">가방</button><button class="tab" data-tab="codex">유물 도감</button></div>
    <button class="close" data-close="bag">✕</button>
  </div>
  <div id="bagItems" class="tabpane">
    <div id="bagCap"></div>
    <div id="bagGrid"></div>
    <div id="bagDetail">아이템을 선택하세요.</div>
    <div id="craft">
      <h4>만들기</h4>
      <div id="craftList"></div>
    </div>
  </div>
  <div id="bagCodex" class="tabpane hidden"></div>
</div>

<!-- 지도 -->
<div id="mapPanel" class="panel hidden">
  <div class="panel-head"><div>번동중학교 지도</div><button class="close" data-close="mapPanel">✕</button></div>
  <canvas id="bigmap" width="900" height="640"></canvas>
</div>

<!-- 유물 획득 카드 / 게시판 -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <div id="modalBody"></div>
    <button id="modalOk" class="btn primary">확인 (E)</button>
  </div>
</div>

<!-- 일시정지 -->
<div id="pause" class="screen dim hidden">
  <div class="pause-box">
    <h2>일시정지</h2>
    <div class="pause-tabs">
      <button class="tab on" data-ptab="menu">메뉴</button>
      <button class="tab" data-ptab="settings">설정</button>
      <button class="tab" data-ptab="how">조작법</button>
    </div>
    <div class="ppane" data-pane="menu">
      <button id="btnResume" class="btn primary">계속하기</button>
      <button id="btnSave" class="btn">저장하기</button>
      <button id="btnToTitle" class="btn">처음 화면으로</button>
    </div>
    <div class="ppane hidden" data-pane="settings">
      <label>마우스 감도 <input type="range" id="setSens" min="0.2" max="3" step="0.05"></label>
      <label>시야각(FOV) <input type="range" id="setFov" min="60" max="100" step="1"></label>
      <label>전체 소리 <input type="range" id="setVol" min="0" max="1" step="0.05"></label>
      <label>그래픽 품질
        <select id="setQuality"><option value="low">낮음 (노트북)</option><option value="medium">보통</option><option value="high">높음</option></select>
      </label>
      <label>하루 길이
        <select id="setDay"><option value="360">6분</option><option value="720">12분</option><option value="1440">24분</option></select>
      </label>
      <label>날씨
        <select id="setWeather"><option value="auto">자동으로 바뀜</option><option value="clear">맑음</option><option value="cloudy">흐림</option><option value="rain">비</option><option value="storm">뇌우</option><option value="fog">안개</option><option value="snow">눈</option></select>
      </label>
      <label>시간 건너뛰기 <span><button class="btn small" id="btnSkipDay">아침으로</button> <button class="btn small" id="btnSkipNight">밤으로</button></span></label>
      <label class="chk"><input type="checkbox" id="setInvert"> 마우스 상하 반전</label>
    </div>
    <div class="ppane hidden how" data-pane="how"></div>
  </div>
</div>

<!-- 조작법(타이틀) -->
<div id="howTitle" class="screen dim hidden">
  <div class="pause-box"><h2>조작법</h2><div class="how"></div><button class="btn primary" data-close="howTitle">닫기</button></div>
</div>

<!-- 사망 / 승리 -->
<div id="dead" class="screen dim hidden">
  <div class="pause-box center"><h2>기절했다…</h2><p>보건실에서 깨어납니다. 모은 유물과 아이템은 그대로입니다.</p><button id="btnRespawn" class="btn primary">다시 일어나기</button></div>
</div>
<div id="victory" class="screen dim hidden">
  <div class="pause-box center">
    <h2>어둑시니를 물리쳤다!</h2>
    <div id="victoryText"></div>
    <button id="btnFreeRoam" class="btn primary">계속 돌아다니기</button>
    <button id="btnVictoryTitle" class="btn">처음 화면으로</button>
  </div>
</div>

<div id="clickToPlay" class="hidden">클릭하면 게임으로 돌아갑니다</div>
