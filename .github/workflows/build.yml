name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 기본은 읽기 전용. 릴리스 게시 job만 쓰기 권한을 받습니다.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install test browser
        run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest -q

  windows-installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (python -c "import pumui; print(pumui.__version__)") }
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "bad version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/pumui.spec --noconfirm
      - name: Smoke test (exe starts and answers)
        shell: pwsh
        run: |
          $env:PUMUI_NO_BROWSER = "1"
          $env:PUMUI_DATA_DIR = "$env:RUNNER_TEMP\pumui-data"
          $p = Start-Process -FilePath "dist\EdufineAutoPumui\EdufineAutoPumui.exe" -PassThru
          $inst = "$env:PUMUI_DATA_DIR\instance.json"
          for ($i = 0; $i -lt 40 -and -not (Test-Path $inst); $i++) { Start-Sleep 1 }
          Start-Sleep 3
          $info = Get-Content $inst | ConvertFrom-Json
          $ping = Invoke-RestMethod "http://127.0.0.1:$($info.port)/api/ping"
          Write-Host "ping: $($ping | ConvertTo-Json -Compress)"
          $noToken = try { (Invoke-WebRequest "http://127.0.0.1:$($info.port)/api/config" -UseBasicParsing).StatusCode } catch { $_.Exception.Response.StatusCode.value__ }
          Write-Host "config without token: $noToken"
          $check = Invoke-RestMethod -Method Post -Headers @{ "X-Pumui-Token" = $info.token } "http://127.0.0.1:$($info.port)/api/browser-check"
          Write-Host "browser check: $($check | ConvertTo-Json -Compress)"
          Stop-Process -Id $p.Id -Force
          if ($ping.app -ne "pumui") { throw "smoke test failed: ping" }
          if ($noToken -ne 403) { throw "smoke test failed: token not enforced" }
          if (-not $check.ok) { throw "smoke test failed: browser check" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\EdufineAutoPumui -DestinationPath "dist\EdufineAutoPumui-portable-${{ steps.ver.outputs.version }}.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\EdufineAutoPumui-Setup-*.exe, dist\EdufineAutoPumui-portable-*.zip |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EdufineAutoPumui-${{ steps.ver.outputs.version }}
          path: |
            dist/EdufineAutoPumui-Setup-*.exe
            dist/EdufineAutoPumui-portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EdufineAutoPumui-${{ needs.windows-installer.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/EdufineAutoPumui-Setup-*.exe
            dist/EdufineAutoPumui-portable-*.zip
            dist/SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
