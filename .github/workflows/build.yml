name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install test browser
        run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest -q

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (python -c "import pumui; print(pumui.__version__)") }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/pumui.spec --noconfirm
      - name: Smoke test (exe starts and answers)
        shell: pwsh
        run: |
          $env:PUMUI_NO_BROWSER = "1"
          $env:PUMUI_DATA_DIR = "$env:RUNNER_TEMP\pumui-data"
          $p = Start-Process -FilePath "dist\EdufineAutoPumui\EdufineAutoPumui.exe" -PassThru
          $inst = "$env:PUMUI_DATA_DIR\instance.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $inst); $i++) { Start-Sleep 1 }
          Start-Sleep 3
          $port = (Get-Content $inst | ConvertFrom-Json).port
          $ping = Invoke-RestMethod "http://127.0.0.1:$port/api/ping"
          Write-Host "ping: $($ping | ConvertTo-Json)"
          Invoke-WebRequest "http://127.0.0.1:$port/mock/portal.html" -UseBasicParsing | Out-Null
          Stop-Process -Id $p.Id -Force
          if ($ping.app -ne "pumui") { throw "smoke test failed" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\EdufineAutoPumui -DestinationPath "dist\EdufineAutoPumui-portable-${{ steps.ver.outputs.version }}.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EdufineAutoPumui-${{ steps.ver.outputs.version }}
          path: |
            dist/EdufineAutoPumui-Setup-*.exe
            dist/EdufineAutoPumui-portable-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdufineAutoPumui-Setup-*.exe
            dist/EdufineAutoPumui-portable-*.zip
          body_path: docs/RELEASE_NOTES.md
